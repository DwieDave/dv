name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Dry run: builds and packages every target, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, smoke: run }
          - { target: x86_64-apple-darwin, os: macos-15, smoke: arch }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, smoke: run }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: run }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
      BIN: target/${{ matrix.target }}/release/dv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test (run)
        if: matrix.smoke == 'run'
        run: |
          "$BIN" --version | tee /dev/stderr | grep -qF "dv $VERSION"
      - name: Smoke test (architecture only, cross-compiled)
        if: matrix.smoke == 'arch'
        run: |
          lipo -archs "$BIN" | tee /dev/stderr | grep -qx x86_64
      - run: .github/scripts/package.sh "$TARGET" "$VERSION" "$BIN" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "dv $GITHUB_REF_NAME"

  formula:
    needs: [verify, build]
    runs-on: macos-15
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: .github/scripts/render-formula.sh "$VERSION" dist > dv.rb
      - name: Lint the formula in a scratch tap
        run: |
          brew tap-new --no-git dwiedave/release-check
          cp dv.rb "$(brew --repository)/Library/Taps/dwiedave/homebrew-release-check/Formula/dv.rb"
          brew style dwiedave/release-check/dv
          brew audit --strict --formula dwiedave/release-check/dv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formula
          path: dv.rb
          if-no-files-found: error

  tap:
    needs: [verify, release, formula]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DwieDave/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula
          path: tap/Formula
      - name: Commit and push the formula
        working-directory: tap
        run: |
          git add Formula/dv.rb
          if git diff --cached --quiet; then
            echo "Formula/dv.rb already at $VERSION"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "dv $VERSION"
          git push
