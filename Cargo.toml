[package]
name = "dv"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DwieDave/dv"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
memchr = "2.8.3"
neo_frizbee = "0.13.3"
ratatui = "0.30.2"
regex = "1.13.1"
saphyr = "=0.1.0"
saphyr-parser = "=0.1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
insta = "1.48.0"
proptest = "1.11.0"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[[example]]
name = "gen"
test = true

[[bench]]
name = "load"
harness = false

[[bench]]
name = "ui"
harness = false
