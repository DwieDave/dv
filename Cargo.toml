[package]
name = "dv"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
memchr = "2.8.3"
ratatui = "0.30.2"
saphyr = "0.1.0"
saphyr-parser = "0.1.0"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
insta = "1.48.0"
proptest = "1.11.0"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tempfile = "3.27.0"

[[example]]
name = "gen"
test = true

[[bench]]
name = "load"
harness = false

[[bench]]
name = "ui"
harness = false
