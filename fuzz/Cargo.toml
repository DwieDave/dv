[package]
name = "dv-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dv = { path = ".." }

# Outside the main workspace: built only from the `nix develop .#fuzz` shell.
[workspace]

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ndjson"
path = "fuzz_targets/ndjson.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml"
path = "fuzz_targets/yaml.rs"
test = false
doc = false
bench = false
